spring:
  application:
    name: alarm-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alarmdb}
    username: ${POSTGRES_USER:alarmuser}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

notification:
  enabled: true
  workers: 4
  queue-capacity: 100
  endpoint: http://localhost:8081/external/notifications
  connect-timeout-ms: 2000
  read-timeout-ms: 5000