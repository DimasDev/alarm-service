spring:
  application:
    name: alarm-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alarmdb}
    username: ${DB_USERNAME:alarmuser}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration