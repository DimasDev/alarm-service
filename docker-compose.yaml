services:
  postgres:
    image: postgres:17
    container_name: alarm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alarmdb}
      POSTGRES_USER: ${POSTGRES_USER:-alarmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? Please set POSTGRES_PASSWORD environment variable in .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alarmuser} -d ${POSTGRES_DB:-alarmdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
  alarm-service:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    container_name: alarm-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alarmdb}
      POSTGRES_USER: ${POSTGRES_USER:-alarmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? Please set POSTGRES_PASSWORD environment variable in .env file}
      NOTIFICATION_ENDPOINT: ${NOTIFICATION_ENDPOINT:-http://localhost:8080/mock/notifications}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: